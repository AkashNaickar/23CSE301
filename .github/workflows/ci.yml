name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate notebooks (JSON, syntax, imports, data files)
        run: python scripts/validate_notebooks.py

      - name: Execute notebook subset headlessly
        env:
          MPLBACKEND: Agg
        run: python scripts/run_notebooks.py
